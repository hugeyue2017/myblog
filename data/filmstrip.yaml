# 首页「胶片条」的照片清单
#
# 怎么换图：把照片放进 assets/images/（Hugo 只处理 assets/ 里的图，放 static/
#   的图不压缩、EXIF 也会跟着公开），再改下面的文件名即可。
#   张数随意增减，版式会自动适应。
#
# to 字段（可选）—— 让首页这一帧点到影像页的「同一张」：
#   首页每一帧都会链到 /gallery/#pN。模板先在 data/gallery.yaml 里按图片路径
#   找对应的那张；找不到时（比如同场景在相册里留的是另一张取景）才用这里的 to
#   指过去。两边都匹配不上的帧会退化成静态图（点了没反应）。

