# 影像页（/gallery/）的照片清单
#
# 怎么加图 / 换图：
#   1) 照片放进 assets/images/（**不要放 static/**，放 static 的图 Hugo 不处理，
#      原图和 EXIF 里的定位、机型会一起公开）
#   2) 在下面加一条，顺序就是画廊里的顺序
#
# 字段：
#   img    图片路径，形如 /images/xxx.jpg
#   title  场景标题（一行，会显示在图下面最大的那行）
#   note   场景备注（一句话，写清楚这张照片当时在发生什么）
#   date   可选，形如 2026.09.28；不写就不显示

- img: /images/ultrasound.jpg
  title: 第一次见你
  note: 四维彩超的屏幕上，你侧着脸，像一个小小的、正在做梦的人

- img: /images/family.jpg
  title: 山上的蘑菇屋
  note: 爸爸妈妈先替你去看了看。那时候你还只是个念头

- img: /images/birth.jpg
